
name: HDL CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hdl-ci:
    name: HDL CI
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install open-source HDL tools
      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      # 3. Verify installations
      - name: Verify HDL tools
        run: |
          verilator --version
          iverilog -V
          vvp -V

      # 4. Find Verilog/SystemVerilog source files
      - name: Find HDL source files
        shell: bash
        run: |
          if [ ! -d src ]; then
            echo "ERROR: Missing src directory."
            exit 1
          fi

          find src -type f \( -name '*.v' -o -name '*.sv' \) \
            | sort > sources.txt

          if [ ! -s sources.txt ]; then
            echo "ERROR: No HDL source files found in src/."
            exit 1
          fi

          echo "Found HDL source files:"
          cat sources.txt

#    # 5. Lint HDL using Verilator
#      - name: Lint HDL
#        shell: bash
       # run: |
  #        mapfile -t sources < sources.txt

#          verilator --lint-only -Wno-fatal "${sources[@]}"
#
  #        echo "HDL lint passed.

      # 6. Compile HDL using Icarus Verilog
      - name: Compile HDL
        shell: bash
        run: |
          mkdir -p build

          mapfile -t sources < sources.txt

          iverilog -g2012 -tnull "${sources[@]}"

          echo "HDL compilation passed."

      # 7. Compile and run every testbench
      - name: Run simulations
        shell: bash
        run: |
          if [ ! -d testbench ]; then
            echo "ERROR: Missing testbench directory."
            exit 1
          fi

          mapfile -t testbenches < <(
            find testbench -type f \
              \( -name 'tb_*.v' -o -name 'tb_*.sv' \) \
              | sort
          )

          if [ "${#testbenches[@]}" -eq 0 ]; then
            echo "ERROR: No testbenches found matching tb_*.v or tb_*.sv."
            exit 1
          fi

          mkdir -p build

          mapfile -t sources < sources.txt

          for tb in "${testbenches[@]}"; do
            module="$(basename "$tb")"
            module="${module%.*}"
            output="build/${module}.vvp"

            echo ""
            echo "========================================"
            echo "Testbench: $tb"
            echo "Top module: $module"
            echo "========================================"

            # Compile design sources and this testbench
            iverilog -g2012 \
              -s "$module" \
              -o "$output" \
              "${sources[@]}" \
              "$tb"

            echo "Running simulation: $module"

            # Run simulation; stop CI if it fails
            vvp "$output"

            echo "PASS: $tb"
          done

          echo ""
          echo "All testbench simulations passed."
