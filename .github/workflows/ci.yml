
name: HDL CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hdl-ci:
    name: HDL CI
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install open-source HDL tools
      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      # 3. Verify installations
      - name: Verify HDL tools
        run: |
          verilator --version
          iverilog -V
          vvp -V

      # 4. Find Verilog/SystemVerilog source files
      - name: Find HDL source files
        id: find_hdl
        shell: bash
        run: |
          # Create src directory if it does not exist
          mkdir -p src

          # Find all Verilog and SystemVerilog source files
          find src -type f \( -name '*.v' -o -name '*.sv' \) \
            | sort > sources.txt

          # Skip HDL checks if no source files are available
          if [ ! -s sources.txt ]; then
            echo "No HDL source files found. HDL checks will be skipped."
            echo "has_hdl=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found HDL source files:"
            cat sources.txt
            echo "has_hdl=true" >> "$GITHUB_OUTPUT"
          fi

      # 5. Lint HDL using Verilator
      # Uncomment this step if you want linting enabled.
      #
      # - name: Lint HDL
      #   if: steps.find_hdl.outputs.has_hdl == 'true'
      #   shell: bash
      #   run: |
      #     # Load HDL source files
      #     mapfile -t sources < sources.txt
      #
      #     # Check syntax and potential design issues
      #     # -Wno-fatal allows warnings without failing CI
      #     verilator --lint-only -Wno-fatal "${sources[@]}"
      #
      #     echo "HDL lint passed."

      # 6. Compile HDL using Icarus Verilog
      - name: Compile HDL
        if: steps.find_hdl.outputs.has_hdl == 'true'
        shell: bash
        run: |
          # Create build directory
          mkdir -p build

          # Load HDL source files
          mapfile -t sources < sources.txt

          # Compile-check the design
          iverilog -g2012 -tnull "${sources[@]}"

          echo "HDL compilation passed."

      # 7. Compile and run every testbench
      - name: Run simulations
        shell: bash
        run: |
          # Create testbench directory if it does not exist
          mkdir -p testbench

          # Find testbenches by filename
          # The module name inside each file can be different
          mapfile -t testbenches < <(
            find testbench -type f \
              \( -name 'tb_*.v' -o -name 'tb_*.sv' \) \
              | sort
          )

          # Skip simulations if no testbenches are available
          if [ "${#testbenches[@]}" -eq 0 ]; then
            echo "No testbenches found. Simulations will be skipped."
            exit 0
          fi

          # Skip simulations if there are no design sources
          if [ ! -s sources.txt ]; then
            echo "No HDL source files available. Simulations will be skipped."
            exit 0
          fi

          # Create build directory
          mkdir -p build

          # Load HDL source files
          mapfile -t sources < sources.txt

          # Compile and run each testbench
          for tb in "${testbenches[@]}"; do
            name="$(basename "$tb")"
            name="${name%.*}"
            output="build/${name}.vvp"

            echo ""
            echo "========================================"
            echo "Testbench file: $tb"
            echo "========================================"

            # Compile design sources and testbench.
            # Do not specify -s "$name": the module name may differ
            # from the testbench filename.
            iverilog -g2012 \
              -o "$output" \
              "${sources[@]}" \
              "$tb"

            # Run simulation
            echo "Running simulation: $name"
            vvp "$output"

            # Report successful simulation
            echo "PASS: $tb"
          done

          echo ""
          echo "All testbench simulations passed."
