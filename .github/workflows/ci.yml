
name: HDL CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hdl-ci:
    name: HDL CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Install HDL tools
      # --------------------------------------------------

      - name: Install HDL tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      - name: Install Verilator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install verilator -y --no-progress

      - name: Install Icarus Verilog (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install iverilog -y --no-progress

      # --------------------------------------------------
      # Verify tool installation
      # --------------------------------------------------

      - name: Verify HDL tools
        shell: pwsh
        run: |
          verilator --version
          iverilog -V
          vvp -V

      # --------------------------------------------------
      # Discover design source files
      # --------------------------------------------------

      - name: Find HDL source files
        shell: pwsh
        run: |
          if (-not (Test-Path "src")) {
            throw "Missing src directory."
          }

          $sources = @(
            Get-ChildItem src -Recurse -File |
              Where-Object {
                $_.Extension -in @(".v", ".sv")
              } |
              ForEach-Object {
                $_.FullName
              }
          )

          if ($sources.Count -eq 0) {
            throw "No Verilog/SystemVerilog source files found in src/."
          }

          $sources | Set-Content -Encoding utf8 sources.txt

          Write-Host "Found $($sources.Count) HDL source files."

          $sources | ForEach-Object {
            Write-Host "Source: $_"
          }

      # --------------------------------------------------
      # Lint with Verilator
      # --------------------------------------------------

      - name: Lint HDL
        shell: pwsh
        run: |
          $sources = @(Get-Content sources.txt)

          verilator --lint-only -Wno-fatal @sources

          if ($LASTEXITCODE -ne 0) {
            throw "Verilator lint failed."
          }

          Write-Host "HDL lint passed."

      # --------------------------------------------------
      # Compile HDL sources
      # --------------------------------------------------

      - name: Compile HDL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          $sources = @(Get-Content sources.txt)

          iverilog -g2012 -tnull @sources

          if ($LASTEXITCODE -ne 0) {
            throw "HDL compilation failed."
          }

          Write-Host "HDL compilation passed."

      # --------------------------------------------------
      # Discover and run testbenches
      #
      # Naming convention:
      #   testbench/tb_top.sv
      #   testbench/tb_counter.sv
      #
      # Module names:
      #   module tb_top;
      #   module tb_counter;
      # --------------------------------------------------

      - name: Run simulations
        shell: pwsh
        run: |
          if (-not (Test-Path "testbench")) {
            throw "Missing testbench directory."
          }

          $testbenches = @(
            Get-ChildItem testbench -Recurse -File |
              Where-Object {
                $_.Name -match '^tb_.+\.(v|sv)$'
              }
          )

          if ($testbenches.Count -eq 0) {
            throw "No testbenches found matching tb_*.v or tb_*.sv."
          }

          New-Item -ItemType Directory -Force build | Out-Null

          $sources = @(Get-Content sources.txt)

          foreach ($tb in $testbenches) {
            $module = [System.IO.Path]::GetFileNameWithoutExtension($tb.Name)
            $output = Join-Path "build" "$module.vvp"

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Testbench: $($tb.Name)"
            Write-Host "Top module: $module"
            Write-Host "========================================"

            # Compile design sources and testbench together.
            iverilog -g2012 -s $module -o $output @sources "$($tb.FullName)"

            if ($LASTEXITCODE -ne 0) {
              throw "Testbench compilation failed: $($tb.Name)"
            }

            # Run simulation.
            vvp $output

            if ($LASTEXITCODE -ne 0) {
              throw "Simulation failed: $($tb.Name)"
            }

            Write-Host "PASS: $($tb.Name)"
          }

          Write-Host ""
          Write-Host "All testbench simulations passed."

